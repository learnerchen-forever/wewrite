<!-- WeWrite 图表生成命令图标（E6 · 流程图：两节点 + 折线箭头）
     规范：24 网格 · 2px 圆头线稿 · currentColor · 无填充 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 起始节点 -->
  <rect x="3" y="3" width="8.5" height="5.5" rx="1.5"/>
  <!-- 终止节点 -->
  <rect x="12.5" y="15.5" width="8.5" height="5.5" rx="1.5"/>
  <!-- 折线：起始节点下沿 → 折向终止节点 -->
  <path d="M7.2 8.5v5.2a2 2 0 0 0 2 2h3.2"/>
  <!-- 箭头 -->
  <path d="M9.4 12.7 12.4 15.7 9.4 18.7"/>
</svg>
