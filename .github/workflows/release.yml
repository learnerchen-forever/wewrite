name: Smart Release

on:
  push:
    branches: [master, main]
    paths:
      - 'manifest.json'

permissions:
  contents: write
  # Needed to mint OIDC tokens and store build-provenance attestations for the
  # release assets (main.js / styles.css).
  id-token: write
  attestations: write

jobs:
  smart-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read version from manifest.json
        run: |
          VERSION=$(jq -r .version manifest.json)
          MIN_APP=$(jq -r .minAppVersion manifest.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MIN_APP=$MIN_APP" >> $GITHUB_ENV

      - name: Check if tag already exists
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping release."
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          else
            echo "SKIP_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Check version consistency
        if: env.SKIP_RELEASE != 'true'
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$PKG_VER" != "$VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VER, manifest.json=$VERSION"
            exit 1
          fi

      # Release notes come first: the notes are bundled into main.js, so they
      # must exist before the build. This step also refuses to publish a
      # release whose changes nobody described.
      - name: Generate release notes
        if: env.SKIP_RELEASE != 'true'
        run: node tools/changelog.js release "$VERSION"

      - name: Update versions.json
        if: env.SKIP_RELEASE != 'true'
        run: |
          # Obsidian reads versions.json as { "<plugin version>": "<minAppVersion>" }.
          jq --arg v "$VERSION" --arg m "$MIN_APP" '. + {($v): $m}' versions.json > versions.tmp.json
          mv versions.tmp.json versions.json

      - name: Type check
        if: env.SKIP_RELEASE != 'true'
        run: npm run typecheck

      - name: Run unit tests
        if: env.SKIP_RELEASE != 'true'
        run: npm test

      - name: Build plugin
        if: env.SKIP_RELEASE != 'true'
        run: npm run build

      # Runs before the commit and tag, so an iOS-incompatible bundle is never
      # released. Same gate as ci.yml, repeated here because a release must not
      # depend on another workflow having passed.
      - name: Check iOS 15 compatibility
        if: env.SKIP_RELEASE != 'true'
        run: npm run check:bundle

      - name: Verify bundled release notes
        if: env.SKIP_RELEASE != 'true'
        run: |
          node -e '
            const data = require("./src/core/changelog-data.json");
            const entry = data.entries.find((e) => e.version === process.env.VERSION);
            if (!entry) {
              console.error(`::error::${process.env.VERSION} has no release notes to bundle.`);
              process.exit(1);
            }
            console.log(`Bundled ${entry.sections.reduce((n, s) => n + s.items.length, 0)} note(s) for ${entry.version}.`);
          '

      - name: Commit generated changelog
        if: env.SKIP_RELEASE != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md src/core/changelog-data.json versions.json changelog.d
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): $VERSION changelog and versions.json"
            git push
          fi

      - name: Create and push Git tag
        if: env.SKIP_RELEASE != 'true'
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      # Artifact attestations: cryptographically prove main.js/styles.css were
      # built by this workflow from this repository (GitHub trusted build).
      - name: Attest build provenance (main.js)
        if: env.SKIP_RELEASE != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js
          subject-name: main.js

      - name: Attest build provenance (styles.css)
        if: env.SKIP_RELEASE != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css
          subject-name: styles.css

      - name: Create GitHub Release
        id: create_release
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          # Auto-generate release notes from commits/PRs since the last tag so
          # users can see what changed in this version.
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
