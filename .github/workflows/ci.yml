name: CI

on:
  push:
    branches: [master, main, '**-v*']
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          MANIFEST_VER=$(node -p "require('./manifest.json').version")
          if [ "$PKG_VER" != "$MANIFEST_VER" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VER, manifest.json=$MANIFEST_VER"
            exit 1
          fi
          echo "Versions match: $PKG_VER"

      # Obsidian reads versions.json as { "<plugin version>": "<minAppVersion>" }.
      # A manifest-shaped value silently breaks the "which app version does
      # this release need" fallback, and that is what happened here until 2.0.18.
      - name: Validate versions.json
        run: |
          node -e '
            const versions = require("./versions.json");
            const bad = Object.entries(versions).filter(([, value]) => typeof value !== "string");
            if (bad.length > 0) {
              console.error(`::error::versions.json must map a plugin version to a minAppVersion string; ${bad.length} entry(ies) are objects.`);
              process.exit(1);
            }
            console.log(`versions.json: ${Object.keys(versions).length} entries, all strings.`);
          '

      # CHANGELOG.md is the source of truth; the bundled JSON is derived from
      # it. Failing here means someone edited one without the other.
      - name: Check bundled changelog is in sync
        run: node tools/changelog.js check

      - name: Type check
        run: npm run typecheck

      # tsconfig.json only covers src/, and ts-jest runs transpile-only, so
      # nothing else ever type-checked the test suite. That is how 22 type
      # errors (wrong arities, incomplete fixtures, assertions Jest ignores)
      # accumulated unnoticed.
      - name: Type check tests
        run: npm run typecheck:tests

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The plugin must still load on iOS 15.x. A regex lookbehind or a class
      # static block throws a SyntaxError while the bundle is parsed, which
      # takes the whole plugin down — esbuild's ES2020 target does not
      # transpile either away.
      - name: Check iOS 15 compatibility
        run: npm run check:bundle
